spring.application.name=api-gateway
server.port=9000

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
spring.main.allow-bean-definition-overriding=true

# Config Server
spring.cloud.config.enabled=true
spring.config.import=optional:configserver:http://localhost:8888

# Routes Gateway
spring.cloud.gateway.routes[0].id=logistics-service
spring.cloud.gateway.routes[0].uri=lb://logistics-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/logistics/**,/equipments/**,/staffs/**,/assignments/**,/schedules/**

# Discovery locator (auto-routing via Eureka)
spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true

management.endpoints.web.exposure.include=*
