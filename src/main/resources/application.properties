spring.application.name=Event

# MySQL Datasource
spring.datasource.url=jdbc:mysql://localhost:3306/event_db
spring.datasource.username=root
spring.datasource.password=2531999lM
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Server
server.port=8081

# Disable config server
spring.cloud.config.enabled=false
spring.cloud.config.import-check.enabled=false

# Actuator - monitoring
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

# Eureka client - register with Eureka Server (with credentials)
eureka.client.service-url.defaultZone=http://admin:admin@localhost:8761/eureka/
eureka.instance.prefer-ip-address=true