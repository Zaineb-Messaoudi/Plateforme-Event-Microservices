# Configuration centralisée du abonnement-service
welcome.message=Welcome to Abonnement MS - Gestion des Evenements

# MySQL Database
spring.datasource.url=jdbc:mysql://mysql:3306/abonnementdb?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=abonnement
spring.datasource.password=abonnement

# JPA
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Stripe
stripe.api.secret-key=${STRIPE_API_SECRET_KEY:}
stripe.api.public-key=${STRIPE_API_PUBLIC_KEY:}

# RabbitMQ
spring.rabbitmq.host=rabbitmq
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
